name: Web App CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/web-app-ci.yml"
      - "OZwizard.png"
      - "README.md"
      - "python_implementation/web_app/**"
  pull_request:
    paths:
      - ".github/workflows/web-app-ci.yml"
      - "OZwizard.png"
      - "README.md"
      - "python_implementation/web_app/**"
  workflow_dispatch:

jobs:
  web-app:
    name: Build and Test OZwizard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_implementation/web_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: python_implementation/web_app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: End-to-end checks
        run: npm run test:e2e
